# =============================================================================
#  CONFIGURAÇÃO DO GRUPO
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "ChatBot TCC (Chatbot TCC)"
  integrantes:          # 3 a 4 integrantes
    - nome: "Gabriel Yukihiro"
      rga: "201919070095"
    - nome: "Natan da Rocha Ramalho"
      rga: "202519060384"
    - nome: "Zullaê Ramos de Freitas Ramires"
      rga: "202519060309"

tema:
  nome: "Trabalho de Conclusão de Curso"
  descricao: >
    Tira dúvidas dos acadêmicos da UFMS sobre o TCC: início e registro, escolha de
    orientador, prazos, banca, formatação e normas e depósito da versão final.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    Você é o Brunao, assistente virtual da Universidade dos Desesperados, que sana
    dúvidas acerca de TCC. Fale de forma simples, direta e de fácil entendimento,
    tratando o estudante por "você". Responda apenas com base nos trechos dos
    documentos oficiais; se a informação não estiver neles, diga que não sabe e
    indique o contato.
  contato: "a Coordenação do seu curso ou o e-mail da FACOM: facom@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0   # escolher com dados no Passo 12

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  inicio_tcc:
    descricao: "como iniciar e registrar o TCC"
    resposta: >
      Você pode iniciar o TCC a qualquer momento, desde que cumpra as exigências do
      Projeto Pedagógico do seu curso. O início é registrado por você no Siscad e
      precisa ser aprovado pelo orientador; depois, a Coordenação de Curso dá ciência.
      O TCC pode ser individual ou em grupo.
  orientador:
    descricao: "escolha e papel do orientador"
    resposta: >
      Qualquer professor efetivo da carreira do magistério superior da UFMS pode
      orientar TCC. Professores de fora da sua unidade também podem, se aprovados pelo
      Colegiado do Curso. O orientador aprova o início do trabalho e propõe a banca.
  prazos:
    descricao: "prazos e datas do TCC"
    resposta: >
      A defesa deve acontecer até o fim do período letivo em que você pretende colar
      grau. O orientador agenda a defesa com pelo menos 15 dias de antecedência, e o
      texto deve chegar à banca também com 15 dias de antecedência. Não entregar no
      prazo deixa o TCC como "não cumprido".
  formatacao:
    descricao: "formato, modelo e normas do texto"
    resposta: >
      O TCC pode ser monografia, relatório técnico, artigo ou portfólio, em português,
      inglês ou espanhol (nesses dois casos, com resumo em português). Na FACOM não há
      modelo obrigatório: são recomendados os modelos SBC, IEEE ou ACM, e as normas
      ABNT são opcionais.
  banca:
    descricao: "banca avaliadora e defesa"
    resposta: >
      A banca é proposta pelo orientador e constituída pelo Colegiado: o orientador
      preside e há no mínimo mais dois membros. A defesa é pública, com apresentação e
      arguição oral, e o resultado é "aprovado" ou "reprovado". A FACOM sugere uma
      apresentação de 20 a 30 minutos.
  deposito:
    descricao: "entrega e depósito da versão final"
    resposta: >
      Depois da aprovação pela banca e da revisão final, você anexa o documento final
      no Siscad e a versão final é publicada no Repositório Institucional da UFMS
      (repositorio.ufms.br). A carga horária só é registrada após a aprovação e a
      anexação do documento final.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"