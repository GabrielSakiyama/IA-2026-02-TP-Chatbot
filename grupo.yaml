tema:
  nome: "ChatBot TCC" #nome --> TODO
  descricao: > # descricao ---> TODO
    Tirar duvidas dos acadêmicos sobre o TCC: 
    escolha de orientador, prazo, banca, formatação e normas, depósito da versão final.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: > #persona --> TODO - quem é o bot e como ele fala 
    "Você é o Brunao, assistente virtual da 
     Universidade dos desesperados, que sana duvidas acerca de TCC. Fale de forma simples, direto e de fácil entedimento."
  contato: "A coordenação do curso ou pelo email do coordenador: coordenador@email.com" #contato - TODO: para onde encaminhar o que o bot não sabe (setor, e-mail...)
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  TODO_intencao_1: # ideias de intenções iniciais - as descricoes e respostas --> TODO
    descricao: "escolha de orientador"
    resposta: > # TODO: resposta fixa curta (usada sem LLM e na avaliação automática). Com o LLM ligado, o bot responde a partir dos documentos da pasta documentos/. 
      
  TODO_intencao_2:
    descricao: "prazos limite e dilação"
    resposta: >
      TODO
  TODO_intencao_3:
    descricao: "composição de professores para compor a banca"
    resposta: >
      TODO
  TODO_intencao_4:
    descricao: "formatação e normas"
    resposta: >
      TODO
  TODO_intencao_5:
    descricao: "depósito da versão final"
    resposta: >
